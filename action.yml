name: 'WCAG Scanner'
description: 'Scans Angular files for WCAG 2.2 accessibility issues and posts a comment on the PR with the results.'
inputs:
  mitigation-api-key:
    description: 'API key for WCAG Scanner. Get yours at https://mitigation.team'
    required: true
  github-token:
    description: 'Github token required to post comments on PRs'
    required: true
  path:
    description: 'Folders files to scan (glob pattern)'
    required: false
    default: 'src/**/*.{html,ts}'

runs:
  using: 'composite'
  steps:
    - name: Validate API Key
      run: |
        if [ -z "${{ inputs.mitigation-api-key }}" ]; then
          echo "::error::Mitigation API Key is required. Get yours at https://mitigation.team"
          exit 1
        fi
      shell: bash

    - name: Install dependencies
      run: npm install
      working-directory: ${{ github.action_path }}
      shell: bash

    - name: Run Scanner
      run: |
        npm run scan --silent -- "$GITHUB_WORKSPACE/${{ inputs.path }}" --json > results.json || true
      working-directory: ${{ github.action_path }}
      shell: bash

    - name: Post Comment on PR
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const resultsPath = path.join(process.env.GITHUB_ACTION_PATH, 'results.json');
          
          if (!fs.existsSync(resultsPath)) {
            console.log('No results file found');
            return;
          }

          const content = fs.readFileSync(resultsPath, 'utf8');
          if (!content.trim()) {
            console.log('Results file is empty');
            return;
          }

          const results = JSON.parse(content);
          
          if (results.length === 0) return;

          let body = '### ♿ WCAG Scanner Report\n\n';
          body += '| Severity | Rule | File | Line | Message |\n';
          body += '| --- | --- | --- | --- | --- |\n';
          
          results.forEach(f => {
            const icon = f.severity === 'critical' ? '🔴' : f.severity === 'high' ? '🟠' : '🟡';
            body += `| ${icon} ${f.severity} | ${f.wcag} | ${f.file} | ${f.line} | ${f.message} |\n`;
          });

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });